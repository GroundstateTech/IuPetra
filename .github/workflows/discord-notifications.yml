name: Discord Notifications

on:
  release:
    types: [published]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [opened, reopened, closed]
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.name != 'Discord Notifications')
    runs-on: ubuntu-latest
    steps:
      - name: Post event to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; notification skipped."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)

          event_name = os.environ["EVENT_NAME"]
          action = os.environ.get("EVENT_ACTION", "")
          repository = os.environ["REPOSITORY"]
          actor = os.environ["ACTOR"]

          title = "Groundstate GitHub update"
          description = ""
          url = f"https://github.com/{repository}"
          color = 0x20C7E8

          if event_name == "release":
              release = event["release"]
              title = f"🚀 Release published: {release.get('name') or release['tag_name']}"
              description = f"**{repository}** published `{release['tag_name']}`."
              url = release["html_url"]
              color = 0x36D399

          elif event_name == "pull_request_target":
              pull = event["pull_request"]
              merged = bool(pull.get("merged"))
              if action == "closed" and merged:
                  label = "merged"
                  icon = "✅"
                  color = 0x8957E5
              elif action == "closed":
                  label = "closed"
                  icon = "🔒"
                  color = 0x6B7280
              elif action == "ready_for_review":
                  label = "ready for review"
                  icon = "👀"
                  color = 0xF5A524
              else:
                  label = action
                  icon = "🔀"
                  color = 0x20C7E8
              title = f"{icon} PR #{pull['number']} {label}: {pull['title']}"
              description = f"**{repository}** · opened by **{pull['user']['login']}**"
              url = pull["html_url"]

          elif event_name == "issues":
              issue = event["issue"]
              if action == "opened":
                  icon = "🆕"
                  color = 0x20C7E8
              elif action == "reopened":
                  icon = "♻️"
                  color = 0xF5A524
              else:
                  icon = "☑️"
                  color = 0x6B7280
              title = f"{icon} Issue #{issue['number']} {action}: {issue['title']}"
              description = f"**{repository}** · reported by **{issue['user']['login']}**"
              url = issue["html_url"]

          elif event_name == "workflow_run":
              run = event["workflow_run"]
              title = f"❌ Workflow failed: {run['name']}"
              branch = run.get("head_branch") or "unknown branch"
              description = f"**{repository}** · `{branch}` · triggered by **{run.get('actor', {}).get('login', actor)}**"
              url = run["html_url"]
              color = 0xE5484D

          payload = {
              "username": "Groundstate GitHub",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": title[:256],
                  "description": description[:4096],
                  "url": url,
                  "color": color,
                  "footer": {"text": f"{repository} • {actor}"}
              }]
          }

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Groundstate-GitHub-Discord/1.0"
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY
