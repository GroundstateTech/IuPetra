name: IuPetra CI

on:
  push:
    branches: [The-Citadel, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile iupetra.py reliability.py run_iupetra.py scripts/doctor.py tests/test_core.py tests/test_reliability.py tests/test_runner.py

      - name: Offline preflight
        run: python scripts/doctor.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
